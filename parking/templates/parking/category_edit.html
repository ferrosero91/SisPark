{% extends 'parking/base.html' %}

{% block title %}Editar Categoría - SoluPark{% endblock %}
{% block page_title %}Editar Categoría{% endblock %}
{% block page_subtitle %}Modificar {{ form.instance.name }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <form method="post" class="space-y-6">
        {% csrf_token %}
        
        <div class="bg-white rounded-2xl border border-slate-200 p-6 space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Nombre de la categoría *</label>
                <input type="text" name="name" required value="{{ form.instance.name }}"
                       class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Tarifa primera hora *</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">$</span>
                        <input type="number" name="first_hour_rate" required min="0" step="100"
                               value="{{ form.instance.first_hour_rate|floatformat:0 }}"
                               class="w-full pl-8 pr-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Tarifa hora adicional *</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">$</span>
                        <input type="number" name="additional_hour_rate" required min="0" step="100"
                               value="{{ form.instance.additional_hour_rate|floatformat:0 }}"
                               class="w-full pl-8 pr-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
                    </div>
                </div>
            </div>
            
            <div class="pt-4 border-t border-slate-100">
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="is_monthly" id="isMonthly"
                           {% if form.instance.is_monthly %}checked{% endif %}
                           class="w-5 h-5 rounded border-slate-300 text-sky-600 focus:ring-sky-500">
                    <span class="text-slate-700">Permitir mensualidades para esta categoría</span>
                </label>
            </div>
            
            <div id="monthlyRateField" {% if not form.instance.is_monthly %}class="hidden"{% endif %}>
                <label class="block text-sm font-medium text-slate-700 mb-2">Tarifa mensual</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">$</span>
                    <input type="number" name="monthly_rate" min="0" step="1000"
                           value="{{ form.instance.monthly_rate|default:''|floatformat:0 }}"
                           class="w-full pl-8 pr-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
                </div>
            </div>
        </div>
        
        <div class="flex gap-4">
            <button type="submit" 
                    class="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-medium py-3 px-6 rounded-xl transition-colors flex items-center justify-center gap-2">
                <i class="fas fa-save"></i>
                Guardar Cambios
            </button>
            <a href="{% url 'category-list' %}" 
               class="px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl transition-colors">
                Cancelar
            </a>
        </div>
    </form>
</div>

<script>
document.getElementById('isMonthly').addEventListener('change', function() {
    document.getElementById('monthlyRateField').classList.toggle('hidden', !this.checked);
});
</script>
{% endblock %}
