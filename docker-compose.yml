# ===========================================
# SoluPark - Docker Compose para Producción
# ===========================================
version: '3.8'

services:
  # ===========================================
  # Aplicación Django
  # ===========================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solupark_web
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./media:/app/media
      - staticfiles_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - solupark_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================
  # Base de Datos PostgreSQL
  # ===========================================
  db:
    image: postgres:16-alpine
    container_name: solupark_db
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: solupark
      POSTGRES_USER: solupark
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - solupark_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solupark -d solupark"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Redis para Cache y Sesiones
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: solupark_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - solupark_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  staticfiles_data:

networks:
  solupark_network:
    driver: bridge
