<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Encontrado - SoluPark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-2xl shadow-xl p-8 text-center">
            <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-building text-slate-400 text-4xl"></i>
            </div>
            
            <h1 class="text-2xl font-bold text-slate-900 mb-2">Parqueadero No Encontrado</h1>
            <p class="text-slate-500 mb-6">
                No tienes un parqueadero asignado o el parqueadero no existe.
            </p>
            
            <div class="bg-slate-50 rounded-xl p-4 mb-6">
                <p class="text-sm text-slate-600">
                    Si crees que esto es un error, contacta al administrador.
                </p>
            </div>
            
            <a href="{% url 'login' %}" class="block w-full py-3 bg-sky-600 hover:bg-sky-700 text-white rounded-xl font-medium transition-colors text-center">
                Volver al Inicio
            </a>
        </div>
        
        <p class="text-center text-slate-400 text-sm mt-6">
            © 2025 SoluPark
        </p>
    </div>
</body>
</html>
