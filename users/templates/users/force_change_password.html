<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - SoluPark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-amber-500/30">
                <i class="fas fa-key text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-white">Cambiar Contraseña</h1>
            <p class="text-slate-400 mt-1">Por seguridad, debe cambiar su contraseña</p>
        </div>
        
        <div class="bg-white/5 backdrop-blur-xl rounded-3xl p-8 border border-white/10">
            {% if messages %}
            {% for message in messages %}
            <div class="mb-6 p-4 rounded-xl {% if message.tags == 'error' %}bg-red-500/10 border border-red-500/20 text-red-400{% elif message.tags == 'warning' %}bg-amber-500/10 border border-amber-500/20 text-amber-400{% else %}bg-sky-500/10 border border-sky-500/20 text-sky-400{% endif %}">
                <div class="flex items-center gap-3">
                    <i class="fas {% if message.tags == 'error' %}fa-exclamation-circle{% elif message.tags == 'warning' %}fa-exclamation-triangle{% else %}fa-info-circle{% endif %}"></i>
                    <span>{{ message }}</span>
                </div>
            </div>
            {% endfor %}
            {% endif %}
            
            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Contraseña actual</label>
                    <div class="relative">
                        <input type="password" name="current_password" required autofocus
                               class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 pl-11 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition"
                               placeholder="••••••••">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Nueva contraseña</label>
                    <div class="relative">
                        <input type="password" name="new_password" required minlength="8"
                               class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 pl-11 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition"
                               placeholder="Mínimo 8 caracteres">
                        <i class="fas fa-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Confirmar nueva contraseña</label>
                    <div class="relative">
                        <input type="password" name="confirm_password" required minlength="8"
                               class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 pl-11 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition"
                               placeholder="Repita la contraseña">
                        <i class="fas fa-check-double absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    </div>
                </div>
                
                <button type="submit" 
                        class="w-full bg-amber-600 hover:bg-amber-500 text-white font-medium py-3 px-4 rounded-xl transition-colors">
                    <i class="fas fa-save mr-2"></i>
                    Cambiar Contraseña
                </button>
            </form>
            
            <div class="mt-6 pt-6 border-t border-white/10">
                <form method="post" action="{% url 'logout' %}" class="flex items-center justify-center">
                    {% csrf_token %}
                    <button type="submit" class="flex items-center justify-center gap-2 text-slate-400 hover:text-white transition">
                        <i class="fas fa-sign-out-alt"></i>
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
        
        <p class="text-center text-slate-500 text-sm mt-6">
            © 2025 SoluPark
        </p>
    </div>
</body>
</html>
