<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SoluPark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-sky-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-sky-500/30">
                <i class="fas fa-parking text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-white">SoluPark</h1>
            <p class="text-slate-400 mt-1">Sistema de Parqueaderos</p>
        </div>
        
        <div class="bg-white/5 backdrop-blur-xl rounded-3xl p-8 border border-white/10">
            <h2 class="text-xl font-semibold text-white text-center mb-6">Iniciar Sesión</h2>
            
            {% if messages %}
            {% for message in messages %}
            <div class="mb-6 p-4 rounded-xl {% if message.tags == 'error' %}bg-red-500/10 border border-red-500/20 text-red-400{% else %}bg-sky-500/10 border border-sky-500/20 text-sky-400{% endif %}">
                <div class="flex items-center gap-3">
                    <i class="fas {% if message.tags == 'error' %}fa-exclamation-circle{% else %}fa-info-circle{% endif %}"></i>
                    <span>{{ message }}</span>
                </div>
            </div>
            {% endfor %}
            {% endif %}
            
            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Correo electrónico</label>
                    <div class="relative">
                        <input type="email" name="email" required autofocus
                               class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 pl-11 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition"
                               placeholder="tu@email.com">
                        <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Contraseña</label>
                    <div class="relative">
                        <input type="password" name="password" required
                               class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 pl-11 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition"
                               placeholder="••••••••">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    </div>
                </div>
                
                <button type="submit" 
                        class="w-full bg-sky-600 hover:bg-sky-500 text-white font-medium py-3 px-4 rounded-xl transition-colors">
                    Ingresar
                </button>
            </form>
        </div>
        
        <p class="text-center text-slate-500 text-sm mt-6">
            © 2025 SoluPark
        </p>
    </div>
</body>
</html>
