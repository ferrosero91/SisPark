{% extends 'parking/base.html' %}

{% block title %}{{ title }} - SoluPark{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block page_subtitle %}Configurar método de pago{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <form method="post" class="space-y-6">
        {% csrf_token %}
        
        <div class="bg-white rounded-2xl border border-slate-200 p-6 space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Nombre *</label>
                <input type="text" name="name" value="{{ method.name|default:'' }}" required
                       class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
                       placeholder="Ej: Efectivo, Nequi, Daviplata">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Tipo *</label>
                <select name="payment_type" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
                    {% for value, label in payment_types %}
                    <option value="{{ value }}" {% if method.payment_type == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Descripción</label>
                <input type="text" name="description" value="{{ method.description|default:'' }}"
                       class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
                       placeholder="Descripción opcional">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Icono</label>
                <select name="icon" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
                    <option value="fa-money-bill" {% if method.icon == 'fa-money-bill' %}selected{% endif %}>💵 Efectivo</option>
                    <option value="fa-credit-card" {% if method.icon == 'fa-credit-card' %}selected{% endif %}>💳 Tarjeta</option>
                    <option value="fa-mobile-alt" {% if method.icon == 'fa-mobile-alt' %}selected{% endif %}>📱 Móvil</option>
                    <option value="fa-qrcode" {% if method.icon == 'fa-qrcode' %}selected{% endif %}>📲 QR</option>
                    <option value="fa-university" {% if method.icon == 'fa-university' %}selected{% endif %}>🏦 Banco</option>
                    <option value="fa-hand-holding-usd" {% if method.icon == 'fa-hand-holding-usd' %}selected{% endif %}>🤝 Crédito</option>
                </select>
            </div>
            
            <div class="pt-4 border-t border-slate-100 space-y-3">
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="allow_for_exit" {% if method.allow_for_exit or not method %}checked{% endif %}
                           class="w-5 h-5 rounded border-slate-300 text-sky-600 focus:ring-sky-500">
                    <div>
                        <span class="text-slate-700 font-medium">Permitir en salidas</span>
                        <p class="text-xs text-slate-500">Se puede usar para cobrar salidas de vehículos</p>
                    </div>
                </label>
                
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="allow_for_contracts" {% if method.allow_for_contracts or not method %}checked{% endif %}
                           class="w-5 h-5 rounded border-slate-300 text-sky-600 focus:ring-sky-500">
                    <div>
                        <span class="text-slate-700 font-medium">Permitir en contratos</span>
                        <p class="text-xs text-slate-500">Se puede usar para pagos de mensualidades</p>
                    </div>
                </label>
                
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="is_credit" {% if method.is_credit %}checked{% endif %}
                           class="w-5 h-5 rounded border-slate-300 text-amber-600 focus:ring-amber-500">
                    <div>
                        <span class="text-slate-700 font-medium">Es crédito</span>
                        <p class="text-xs text-slate-500">Solo disponible para clientes registrados</p>
                    </div>
                </label>
                
                {% if method %}
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="is_active" {% if method.is_active %}checked{% endif %}
                           class="w-5 h-5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500">
                    <span class="text-slate-700 font-medium">Activo</span>
                </label>
                {% endif %}
            </div>
        </div>
        
        <div class="flex gap-4">
            <button type="submit" class="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-medium py-3 px-6 rounded-xl transition-colors">
                <i class="fas fa-save mr-2"></i> Guardar
            </button>
            <a href="{% url 'payment_method_list' %}" class="px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl transition-colors">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
