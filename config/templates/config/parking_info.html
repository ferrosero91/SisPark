{% extends 'parking/base.html' %}

{% block title %}Mi Parqueadero - SoluPark{% endblock %}
{% block page_title %}Mi Parqueadero{% endblock %}
{% block page_subtitle %}Información general{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <form method="post" class="space-y-6">
        {% csrf_token %}
        
        <div class="bg-white rounded-2xl border border-slate-200 p-6 space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Nombre del Parqueadero *</label>
                    <input type="text" name="name" value="{{ tenant.name }}" required
                           class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Razón Social *</label>
                    <input type="text" name="business_name" value="{{ tenant.business_name }}" required
                           class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">NIT *</label>
                    <input type="text" name="nit" value="{{ tenant.nit }}" required
                           class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Teléfono *</label>
                    <input type="text" name="phone" value="{{ tenant.phone }}" required
                           class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Email *</label>
                <input type="email" name="email" value="{{ tenant.email }}" required
                       class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Dirección *</label>
                <input type="text" name="address" value="{{ tenant.address }}" required
                       class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Ciudad</label>
                <input type="text" name="city" value="{{ tenant.city }}"
                       class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
            </div>
        </div>
        
        <div class="flex gap-4">
            <button type="submit" class="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-medium py-3 px-6 rounded-xl transition-colors">
                <i class="fas fa-save mr-2"></i> Guardar Cambios
            </button>
            <a href="{% url 'config_dashboard' %}" class="px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl transition-colors">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
